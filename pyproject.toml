[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jordan-climate-pipeline"
version = "1.0.0"
description = "ETL pipeline that collects daily weather and air-quality data for Jordanian cities into a DuckDB warehouse."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mohammed Suhail" }]
dependencies = [
    "requests>=2.31",
    "pandas>=3.0",
    "duckdb>=2.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
climate-pipeline = "climate_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
climate_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0917"]
